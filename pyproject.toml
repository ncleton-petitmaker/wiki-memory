[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-memory-agent"
version = "1.0.0a18"
description = "Local-first event-ledger memory engine with an extensible plugin architecture"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["agents", "memory", "plugins", "local-first", "knowledge-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5", "keyring>=25,<26"]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3",
  "boto3>=1.35,<2",
  "cryptography>=50,<51",
]
postgres = ["psycopg[binary]>=3.2,<4"]
audio-mistral = ["mistralai>=1.9,<3"]
observability = [
  "opentelemetry-distro>=0.58b0,<1",
  "opentelemetry-exporter-otlp>=1.37,<2",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
]
dev = ["build==1.3.0", "httpx>=0.28,<1", "pip-audit>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/ncleton-petitmaker/wiki-memory"
Documentation = "https://github.com/ncleton-petitmaker/wiki-memory/tree/main/docs"
Issues = "https://github.com/ncleton-petitmaker/wiki-memory/issues"
Changelog = "https://github.com/ncleton-petitmaker/wiki-memory/blob/main/CHANGELOG.md"

[project.scripts]
wiki-memory = "wiki_memory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wiki_memory = ["plugin_catalog/**/*.yaml", "plugin_catalog/**/*.json", "profile_catalog/*.yaml", "team_console/*"]
