{{- $name := include "wiki-memory.fullname" . -}}
{{- range $component := list "api" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}-{{ $component }}}
spec:
  replicas: {{ if eq $component "api" }}{{ $.Values.api.replicas }}{{ else }}{{ $.Values.worker.replicas }}{{ end }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: {{ $component }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: {{ $component }}}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $component }}
          image: {{ include "wiki-memory.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $component "api" }}
          args: [team-serve, --host, 0.0.0.0, --port, "8787"]
          ports: [{name: http, containerPort: 8787}]
          readinessProbe: {httpGet: {path: /v1/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /v1/health, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          {{- else }}
          command: [python, -m, wiki_memory.team_worker]
          {{- end }}
          envFrom: [{secretRef: {name: {{ include "wiki-memory.secretName" $ }}}}]
          env:
            - {name: S3_BUCKET, value: {{ $.Values.objectStore.bucket | quote }}}
            - {name: S3_ENDPOINT_URL, value: {{ default (printf "http://%s-minio:9000" $name) $.Values.objectStore.endpoint | quote }}}
            - {name: OIDC_ISSUER, value: {{ $.Values.oidc.issuer | quote }}}
            - {name: OIDC_AUDIENCE, value: {{ $.Values.oidc.audience | quote }}}
            - {name: OIDC_JWKS_URL, value: {{ $.Values.oidc.jwksUrl | quote }}}
            - {name: OIDC_GROUP_SPACE_MAP, value: {{ $.Values.oidc.groupSpaceMap | quote }}}
            - {name: WIKI_MEMORY_TEAM_PLUGIN_TRUST_KEYS, value: {{ $.Values.pluginPolicy.trustKeys | quote }}}
            - {name: WIKI_MEMORY_TEAM_APPROVED_PLUGIN_IDS, value: {{ $.Values.pluginPolicy.approvedPluginIds | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ if eq $component "api" }}{{ toYaml $.Values.resources.api | nindent 12 }}{{ else }}{{ toYaml $.Values.resources.worker | nindent 12 }}{{ end }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
{{- end }}
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
