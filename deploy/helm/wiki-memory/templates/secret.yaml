{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata: {name: {{ include "wiki-memory.fullname" . }}}
type: Opaque
stringData:
  DATABASE_URL: {{ default (printf "postgresql://wiki_memory:%s@%s-postgres:5432/wiki_memory" (urlquery .Values.postgresql.password) (include "wiki-memory.fullname" .)) .Values.postgresql.dsn | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.objectStore.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.objectStore.secretKey | quote }}
  WIKI_MEMORY_BOOTSTRAP_TOKEN: {{ .Values.bootstrapToken | quote }}
  WIKI_MEMORY_RESTORE_ATTESTATION_TOKEN: {{ .Values.restoreAttestationToken | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  MINIO_ROOT_USER: {{ .Values.objectStore.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.objectStore.secretKey | quote }}
{{- end }}
