name: wiki-memory-team
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    command: [postgres, -c, "max_connections=${POSTGRES_MAX_CONNECTIONS:-256}"]
    environment:
      POSTGRES_DB: wiki_memory
      POSTGRES_USER: wiki_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wiki_memory -d wiki_memory]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint: [sh, -ec]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing local/wiki-memory;
        mc version enable local/wiki-memory
    restart: "no"

  api:
    # The release image is intentionally required as a digest.  Building from
    # a checkout belongs in a separate developer override, never in this
    # self-hosting reference topology.
    image: ${WIKI_MEMORY_IMAGE:?set WIKI_MEMORY_IMAGE to a signed GHCR image digest}
    environment: &server-env
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: wiki_memory
      DATABASE_USER: wiki_memory
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      S3_BUCKET: wiki-memory
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_GROUP_SPACE_MAP: ${OIDC_GROUP_SPACE_MAP:?set OIDC_GROUP_SPACE_MAP to a JSON object}
      WIKI_MEMORY_BOOTSTRAP_TOKEN: ${WIKI_MEMORY_BOOTSTRAP_TOKEN:-}
      WIKI_MEMORY_RESTORE_ATTESTATION_TOKEN: ${WIKI_MEMORY_RESTORE_ATTESTATION_TOKEN:?set WIKI_MEMORY_RESTORE_ATTESTATION_TOKEN}
      WIKI_MEMORY_TEAM_PLUGIN_TRUST_KEYS: ${WIKI_MEMORY_TEAM_PLUGIN_TRUST_KEYS:?set WIKI_MEMORY_TEAM_PLUGIN_TRUST_KEYS to a JSON object}
      WIKI_MEMORY_TEAM_APPROVED_PLUGIN_IDS: ${WIKI_MEMORY_TEAM_APPROVED_PLUGIN_IDS:?set WIKI_MEMORY_TEAM_APPROVED_PLUGIN_IDS to a JSON array}
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: [127.0.0.1:8787:8787]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    image: ${WIKI_MEMORY_IMAGE:?set WIKI_MEMORY_IMAGE to a signed GHCR image digest}
    entrypoint: [python, -m, wiki_memory.team_worker]
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
