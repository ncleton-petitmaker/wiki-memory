changelog:
  exclude:
    labels:
      - skip changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking change
    - title: Features
      labels:
        - "type: enhancement"
    - title: Fixes
      labels:
        - "type: bug"
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - dependencies
        - maintenance
    - title: Other changes
      labels:
        - "*"
