name: Bug report
description: Report a reproducible Wiki Memory problem using synthetic data.
title: "[Bug]: "
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Wiki Memory. Never include vault contents, credentials, browser state, client information, or unrelated personal paths.
  - type: input
    id: version
    attributes:
      label: Wiki Memory version
      description: Run `wiki-memory --version` or read the installed plugin version.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Onboarding or installation
        - Vault routing
        - Capture or ingestion
        - Search or QMD
        - Social sync
        - Obsidian or Syncthing
        - Lint or Doctor
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Paste only sanitized output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest sequence that reproduces the issue without private data.
      placeholder: |
        1. Create a new memory from the synthetic example spec
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized Doctor output
      description: Run `wiki-memory doctor <root>` and remove personal paths before pasting.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed secrets, personal paths, browser state, and private source material.
          required: true
        - label: This is not a security vulnerability. I will use the private advisory form for security issues.
          required: true
