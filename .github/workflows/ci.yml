name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src scripts tests
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: |
          tmpdir="$(mktemp -d)"
          python -c 'from pathlib import Path; from wiki_memory.layout import init_memory; import sys; init_memory(Path(sys.argv[1]), {"name":"CI crash", "language":"en"})' "$tmpdir/memory"
          python scripts/crash_campaign.py --root "$tmpdir/memory" --rounds 20 --events-per-worker 10 --delay 0.01 --seed 20260902
      - run: python scripts/schema_validate.py
      - run: python scripts/verify_evidence.py
      - run: python scripts/plugin_conformance.py
      - run: python scripts/deployment_validate.py
      - run: python scripts/privacy_scan.py .
      # The project itself is editable in CI and is audited separately through
      # its signed release artifact.  Freeze only installed project
      # dependencies: auditing the runner's bootstrap `pip` would make a
      # project release depend on an unrelated, platform-image package.
      - run: |
          python -m pip freeze > wiki-memory-audit-requirements.txt
          python -m pip_audit --skip-editable -r wiki-memory-audit-requirements.txt

  dependency-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python scripts/bootstrap.py --dry-run

  helm-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.18.4}
      - run: helm lint deploy/helm/wiki-memory --values deploy/helm/wiki-memory/values.ci.yaml
      - run: helm lint deploy/helm/wiki-memory --values deploy/helm/wiki-memory/values.internal-ci.yaml
      - run: >-
          helm template wiki-memory deploy/helm/wiki-memory --namespace wiki-memory-ci
          --values deploy/helm/wiki-memory/values.ci.yaml > "$RUNNER_TEMP/wiki-memory-rendered.yaml"
      - run: >-
          helm template wiki-memory-internal deploy/helm/wiki-memory --namespace wiki-memory-ci
          --values deploy/helm/wiki-memory/values.internal-ci.yaml > "$RUNNER_TEMP/wiki-memory-internal-rendered.yaml"
      - run: |
          grep --fixed-strings 'kind: NetworkPolicy' "$RUNNER_TEMP/wiki-memory-rendered.yaml"
      - run: |
          grep --fixed-strings 'application-default-deny' "$RUNNER_TEMP/wiki-memory-rendered.yaml"
      - run: |
          grep --fixed-strings 'kind: StatefulSet' "$RUNNER_TEMP/wiki-memory-internal-rendered.yaml"
      - run: |
          grep --fixed-strings 'minio-init' "$RUNNER_TEMP/wiki-memory-internal-rendered.yaml"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  team-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: wiki_memory_test
          POSTGRES_USER: wiki_memory
          POSTGRES_PASSWORD: synthetic-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki_memory -d wiki_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wiki_memory:synthetic-test-password@127.0.0.1:5432/wiki_memory_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[server,dev]'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_team_postgres.py' -v
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_http_api.py' -v
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_oidc.py' -v
      - name: PostgreSQL WAL recovery rehearsal
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/team_pitr_rehearsal.py

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      WIKI_MEMORY_IMAGE: wiki-memory-compose-ci
      POSTGRES_PASSWORD: synthetic-postgres-password
      MINIO_ROOT_USER: wiki-memory-ci
      MINIO_ROOT_PASSWORD: synthetic-minio-password
      OIDC_GROUP_SPACE_MAP: '{}'
      WIKI_MEMORY_BOOTSTRAP_TOKEN: synthetic-bootstrap-token
      WIKI_MEMORY_RESTORE_ATTESTATION_TOKEN: synthetic-restore-attestation-token
      WIKI_MEMORY_TEAM_PLUGIN_TRUST_KEYS: '{}'
      WIKI_MEMORY_TEAM_APPROVED_PLUGIN_IDS: '[]'
      POSTGRES_MAX_CONNECTIONS: '64'
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag "$WIKI_MEMORY_IMAGE" --file deploy/team/Dockerfile .
      - run: docker compose --project-name wiki-memory-compose-ci --file deploy/team/docker-compose.yml config
      - run: >-
          docker compose --project-name wiki-memory-compose-ci
          --file deploy/team/docker-compose.yml up --detach --wait --wait-timeout 120
      - run: curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:8787/v1/health
      - if: always()
        run: >-
          docker compose --project-name wiki-memory-compose-ci
          --file deploy/team/docker-compose.yml down --volumes --remove-orphans
