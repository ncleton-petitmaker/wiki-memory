name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release-gate:
    runs-on: ubuntu-latest
    # Configure `stable-release` with required reviewers. GitHub exposes the
    # three evidence variables only after that approval; alpha/beta tags use an
    # unprotected prerelease environment and cannot claim stable status.
    environment: ${{ contains(github.ref_name, '-') && 'prerelease' || 'stable-release' }}
    env:
      WIKI_MEMORY_PERFORMANCE_EVIDENCE: ${{ vars.WIKI_MEMORY_PERFORMANCE_EVIDENCE }}
      WIKI_MEMORY_PRODUCTION_RECOVERY_EVIDENCE: ${{ vars.WIKI_MEMORY_PRODUCTION_RECOVERY_EVIDENCE }}
      WIKI_MEMORY_EXTERNAL_AUDIT_EVIDENCE: ${{ vars.WIKI_MEMORY_EXTERNAL_AUDIT_EVIDENCE }}
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/release_gate.py --tag "$GITHUB_REF_NAME"

  validation:
    needs: release-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: wiki_memory_release_test
          POSTGRES_USER: wiki_memory
          POSTGRES_PASSWORD: synthetic-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki_memory -d wiki_memory_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wiki_memory:synthetic-test-password@127.0.0.1:5432/wiki_memory_release_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.6.6", enable-cache: true}
      - run: uv sync --frozen --extra server --extra dev
      - run: uv run --frozen python -m compileall -q src scripts tests
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: |
          tmpdir="$(mktemp -d)"
          uv run --frozen python -c 'from pathlib import Path; from wiki_memory.layout import init_memory; import sys; init_memory(Path(sys.argv[1]), {"name":"release crash", "language":"en"})' "$tmpdir/memory"
          uv run --frozen python scripts/crash_campaign.py --root "$tmpdir/memory" --rounds 100 --events-per-worker 20 --delay 0.01 --seed 20260902
      - run: uv run --frozen python scripts/schema_validate.py
      - run: uv run --frozen python scripts/plugin_conformance.py
      - run: uv run --frozen python scripts/deployment_validate.py
      - uses: azure/setup-helm@v5.0.1
        with: {version: v3.18.4}
      - run: helm lint deploy/helm/wiki-memory --values deploy/helm/wiki-memory/values.ci.yaml
      - run: helm lint deploy/helm/wiki-memory --values deploy/helm/wiki-memory/values.internal-ci.yaml
      - run: >-
          helm template wiki-memory deploy/helm/wiki-memory --namespace wiki-memory-release
          --values deploy/helm/wiki-memory/values.ci.yaml > "$RUNNER_TEMP/wiki-memory-rendered.yaml"
      - run: >-
          helm template wiki-memory-internal deploy/helm/wiki-memory --namespace wiki-memory-release
          --values deploy/helm/wiki-memory/values.internal-ci.yaml > "$RUNNER_TEMP/wiki-memory-internal-rendered.yaml"
      - run: |
          grep --fixed-strings 'kind: NetworkPolicy' "$RUNNER_TEMP/wiki-memory-rendered.yaml"
      - run: |
          grep --fixed-strings 'minio-init' "$RUNNER_TEMP/wiki-memory-internal-rendered.yaml"
      - run: uv run --frozen python scripts/privacy_scan.py .
      - name: PostgreSQL WAL recovery rehearsal
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          export PATH="$(pg_config --bindir):$PATH"
          uv run --frozen python scripts/team_pitr_rehearsal.py
      - run: |
          requirements="$(mktemp)"
          uv export --frozen --extra server --extra dev --no-emit-project -o "$requirements" >/dev/null
          uv run --frozen python -m pip_audit --strict --require-hashes -r "$requirements"

  artifacts:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.6.6", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m build
      - uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/source.spdx.json
      - run: cp src/wiki_memory/plugin_catalog/catalog.json dist/plugin-catalog.json
      - run: cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort) > SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - run: cosign sign-blob --yes --bundle dist/plugin-catalog.sigstore.json dist/plugin-catalog.json
      - uses: actions/attest-build-provenance@v4.2.2
        with: {subject-path: "dist/*"}
      - uses: actions/upload-artifact@v7
        with: {name: release-artifacts, path: dist/}

  image:
    needs: validation
    runs-on: ubuntu-latest
    outputs: {digest: "${{ steps.build.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: tags
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deploy/team/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
      - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

  publish-release:
    needs: [artifacts, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: {name: release-artifacts, path: dist}
      - uses: softprops/action-gh-release@v2
        with:
          files: "dist/*"
          generate_release_notes: true
          # Immutable GitHub releases accept assets only while they are drafts.
          # Upload every file first; the explicit `gh release edit` below is
          # the single publish transition.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish immutable release after assets are attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME" --draft=false
          ${{ contains(github.ref_name, '-') && '--prerelease' || '--latest' }}
