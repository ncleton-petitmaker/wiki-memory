apiVersion: wiki-memory/v1
id: source-audio
version: 1.0.0
minimumSdkVersion: 1.0.0
runtime: python
entrypoint: wiki_memory.builtin_plugins:source_audio
provides: [source.audio]
requires: [memory-engine, events, evidence, transcription, projection.markdown]
permissions:
  filesystem: [selected-files, runtime, memory-root]
  network: []
  secrets: []
  subprocess: true
  dataClasses: [audio, transcript, memory]
configSchema: config.schema.json
healthCheck: services
stopTimeoutSeconds: 300
