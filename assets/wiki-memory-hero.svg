<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Wiki Memory</title>
  <desc id="desc">A local-first memory system for Codex, Obsidian, and Syncthing.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2a"/>
      <stop offset="0.55" stop-color="#0d1421"/>
      <stop offset="1" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7c2"/>
      <stop offset="1" stop-color="#76a9ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#273247" stroke-opacity=".35"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#panel)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="70" r="140" fill="#557dff" opacity=".08" filter="url(#glow)"/>
  <circle cx="100" cy="315" r="160" fill="#63efbd" opacity=".07" filter="url(#glow)"/>
  <g transform="translate(76 72)">
    <rect width="216" height="216" rx="52" fill="#0b111d" stroke="#344259" stroke-width="2"/>
    <path d="M42 55h132M42 108h132M42 161h132" stroke="#263247" stroke-width="15" stroke-linecap="round"/>
    <path d="M42 55l33 106 33-78 33 78 33-106" fill="none" stroke="url(#accent)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="55" r="11" fill="#7cf7c2"/>
    <circle cx="75" cy="161" r="11" fill="#74e8cc"/>
    <circle cx="108" cy="83" r="11" fill="#76cfdf"/>
    <circle cx="141" cy="161" r="11" fill="#76b9f2"/>
    <circle cx="174" cy="55" r="11" fill="#76a9ff"/>
  </g>
  <g transform="translate(340 82)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="74" fill="#f7f9fc" font-size="76" font-weight="760" letter-spacing="-3">Wiki Memory</text>
    <text x="2" y="123" fill="#a8b4c7" font-size="24">Your knowledge. Structured, sourced, and yours.</text>
    <g transform="translate(2 157)" font-size="15" font-weight="650" letter-spacing=".6">
      <rect width="136" height="42" rx="21" fill="#15243a" stroke="#31506e"/>
      <text x="68" y="27" text-anchor="middle" fill="#7cf7c2">LOCAL-FIRST</text>
      <rect x="150" width="134" height="42" rx="21" fill="#15243a" stroke="#31506e"/>
      <text x="217" y="27" text-anchor="middle" fill="#82baff">SOURCE-LED</text>
      <rect x="298" width="146" height="42" rx="21" fill="#15243a" stroke="#31506e"/>
      <text x="371" y="27" text-anchor="middle" fill="#c4b5fd">OBSIDIAN READY</text>
    </g>
  </g>
</svg>
