<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wiki Memory</title>
  <desc id="desc">Local-first, source-grounded Markdown memory for Codex, Obsidian, and Syncthing.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2a"/>
      <stop offset=".55" stop-color="#0d1421"/>
      <stop offset="1" stop-color="#080d15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7c2"/>
      <stop offset="1" stop-color="#76a9ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#273247" stroke-opacity=".32"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#panel)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1180" cy="80" r="260" fill="#557dff" opacity=".09" filter="url(#glow)"/>
  <circle cx="80" cy="610" r="280" fill="#63efbd" opacity=".08" filter="url(#glow)"/>
  <g transform="translate(104 118)">
    <rect width="284" height="284" rx="68" fill="#0b111d" stroke="#344259" stroke-width="3"/>
    <path d="M55 72h174M55 142h174M55 212h174" stroke="#263247" stroke-width="20" stroke-linecap="round"/>
    <path d="M55 72l44 140 43-103 43 103 44-140" fill="none" stroke="url(#accent)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="72" r="15" fill="#7cf7c2"/>
    <circle cx="99" cy="212" r="15" fill="#74e8cc"/>
    <circle cx="142" cy="109" r="15" fill="#76cfdf"/>
    <circle cx="185" cy="212" r="15" fill="#76b9f2"/>
    <circle cx="229" cy="72" r="15" fill="#76a9ff"/>
  </g>
  <g transform="translate(460 142)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="94" fill="#f7f9fc" font-size="94" font-weight="760" letter-spacing="-4">Wiki Memory</text>
    <text x="4" y="158" fill="#a8b4c7" font-size="29">Your knowledge. Structured, sourced, and yours.</text>
    <g transform="translate(4 206)" font-size="17" font-weight="650" letter-spacing=".8">
      <rect width="154" height="50" rx="25" fill="#15243a" stroke="#31506e"/>
      <text x="77" y="32" text-anchor="middle" fill="#7cf7c2">LOCAL-FIRST</text>
      <rect x="170" width="150" height="50" rx="25" fill="#15243a" stroke="#31506e"/>
      <text x="245" y="32" text-anchor="middle" fill="#82baff">SOURCE-LED</text>
      <rect x="336" width="170" height="50" rx="25" fill="#15243a" stroke="#31506e"/>
      <text x="421" y="32" text-anchor="middle" fill="#c4b5fd">OBSIDIAN READY</text>
    </g>
    <g transform="translate(4 302)" font-size="21">
      <text x="0" y="0" fill="#d9e1ee">Codex plugin</text>
      <circle cx="156" cy="-7" r="4" fill="#536279"/>
      <text x="176" y="0" fill="#d9e1ee">Plain Markdown</text>
      <circle cx="342" cy="-7" r="4" fill="#536279"/>
      <text x="362" y="0" fill="#d9e1ee">Syncthing safe</text>
    </g>
  </g>
  <text x="108" y="540" fill="#718098" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="1.2">CAPTURE → INGEST → CONNECT → QUERY → REFINE</text>
</svg>
